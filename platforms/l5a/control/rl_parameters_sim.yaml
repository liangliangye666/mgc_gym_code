control:
  # PD控制器参数:
  pd_controller:
    kp: [20.0, 20.0, 30.0, 0.0, 20.0, 20.0, 30.0, 0.0]
    kd: [2, 2, 3, 2.0, 2, 2, 3, 2.0]
    # kp: [20.0, 30.0, 0.0, 20.0, 30.0, 0.0]
    # kd: [0.05, 0.1, 0.5, 0.05, 0.1, 0.5]

  pos_fb_controller:
    kp: [20.0, 20.0, 30.0, 0.0, 20.0, 20.0, 30.0, 0.0]
    kd: [2, 2, 3, 5.0, 2, 2, 3, 5.0]

  action_scales:
    # 位置动作的缩放系数
    pos: 0.5
    # 速度动作的缩放系数
    vel: 10

  decimation: 2

  EDamping:
    edamp_hip: 2.0
    edamp_knee: 2.0
    edamp_wheel: 2.0

obs_scales:
  lin_vel: 2.0
  lin_vel_y: 2.0
  ang_vel: 0.25
  dof_pos: 1.0
  dof_vel: 0.05
  quat: 1.0
  height_measurements: 12.0

clip_obs: 100.0
clip_actions: 100.0

# deg
# default_pos: [-0.349, 0.542, 0.0, -0.349, 0.542, 0.0]
default_pos: [0, 0.261799, -0.508606, 0.0, 0, 0.261799, -0.508606, 0.0]

#速度与角速度补偿
lin_vel_com: -0.0
omega_com: 0.0

model:
  estimator: "estimator.pt"
  controller: "policy_1.pt"
  scan_encoder: "724-02-60000-scan_hist_encoder_jit.pt"
